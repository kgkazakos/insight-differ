[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "insight-differ"
version = "0.1.0"
description = "Compare two research reports to surface contradictions, overlaps, and gaps"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["ux-research", "nlp", "research-ops", "computational-product-research"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "scikit-learn>=1.3",
    "numpy>=1.24",
    "streamlit>=1.32",
]

[project.optional-dependencies]
openai    = ["openai>=1.0"]
anthropic = ["anthropic>=0.25"]
gemini    = ["google-genai>=1.47.0"]
dev       = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
insight-differ = "insight_differ.cli:main"

[tool.setuptools.packages.find]
include = ["insight_differ*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
